<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAB (Something About Books): encontre livros, organize suas leituras e crie o hábito de ler com o Pomodoro." />
    <meta name="theme-color" content="#620000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAB" />
    <meta property="og:title" content="SAB - Something About Books" />
    <meta property="og:description" content="Encontre livros, organize suas estantes e crie o hábito de ler com o Pomodoro." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link rel="preconnect" href="https://openlibrary.org" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <title>SAB</title>
    <script>
      // Aplica o tema antes do primeiro desenho para a página não piscar em branco.
      (function () {
        var theme
        try {
          theme = JSON.parse(localStorage.getItem("sab:theme"))
        } catch (error) {
          theme = null
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
